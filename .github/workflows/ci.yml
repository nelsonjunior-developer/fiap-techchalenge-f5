name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest -q --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Run model non-regression check (artifact-based, CI-friendly)
        run: |
          python -m src.regression_check --selection-path artifacts/model_selection.json --models-root artifacts/models

      - name: Validate data quality CLI (CI skip mode)
        run: |
          python -m src.validate --no-markdown --skip-dataset

      - name: Generate cohort stats CLI (CI skip mode)
        run: |
          python -m src.cohort_stats --no-markdown --skip-dataset
